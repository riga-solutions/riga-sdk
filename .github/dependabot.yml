# Dependabot — supply-chain hygiene for the PUBLISHED SDK (OWASP MCP04).
# @riga-solutions/sdk deps ship to external developers; keep them current and
# surface known-vuln advisories. The SDK's one runtime dep is
# @val-protocol/chain-verifier (caret-pinned + lockfile).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
