# Dependabot — supply-chain hygiene for the PUBLISHED SDK (OWASP MCP04).
# @riga-solutions/sdk deps ship to external developers; keep them current and
# surface known-vuln advisories. The SDK's one runtime dep is
# @val-protocol/chain-verifier (caret-pinned + lockfile).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    ignore:
      # Major bumps adopted deliberately, not on Dependabot's schedule:
      # typescript majors are breaking; @types/node must track the runtime (Node 20).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
